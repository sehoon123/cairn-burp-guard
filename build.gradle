plugins { id 'java' }

group = 'dev.cairnguard'
version = '0.1.0-SNAPSHOT'
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'com.google.re2j:re2j:1.8'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xlint:all', '-parameters'] }
test {
    useJUnitPlatform { excludeTags 'desktop' }
    systemProperty 'java.awt.headless', 'true'
}
// Requires an isolated display (e.g. xvfb-run). Real Swing lifecycle, NOT native Burp.
tasks.register('desktopTest', Test) {
    description = 'Real Swing modal lifecycle and resize checks on an isolated display (not Burp)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'desktop' }
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'sun.java2d.uiScale', providers.gradleProperty('desktopUiScale').getOrElse('1')
    // Robot must target DISPLAY, not an inherited Wayland/desktop portal or the user's session bus.
    ['WAYLAND_DISPLAY', 'WAYLAND_SOCKET', 'DBUS_SESSION_BUS_ADDRESS', 'AT_SPI_BUS_ADDRESS', 'SESSION_MANAGER',
     '_JAVA_AWT_WM_NONREPARENTING', 'AWT_TOOLKIT'].each { environment.remove(it) }
    environment 'XDG_SESSION_TYPE', 'x11'
    environment 'GDK_BACKEND', 'x11'
    environment 'GDK_SCALE', '1'
    environment 'GDK_DPI_SCALE', '1'
    shouldRunAfter test
}
jar {
    archiveBaseName = 'cairn-proxy-guard'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
    manifest { attributes('Implementation-Title': 'Cairn Proxy Guard (independent)', 'Implementation-Version': project.version, 'Burp-Extension-Class': 'dev.cairnguard.GuardExtension') }
    from(files('NOTICE', 'LICENSE')) { into 'META-INF' }
    from('legal') { into 'META-INF/legal' }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
dependencyLocking { lockAllConfigurations() }
